<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erm... Actually! — Settings</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card options">
      <h1>Settings</h1>
      <form id="settings-form">
        <label for="api-key">Google Fact Check Tools API key</label>
        <input id="api-key" name="apiKey" type="password" autocomplete="off" spellcheck="false" />
        <p class="hint">
          Create a key in Google Cloud Console and enable the “Fact Check Tools API”. The key is
          stored only in this browser and is sent only to factchecktools.googleapis.com.
        </p>
        <button class="btn" type="submit">Save</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <h2>Your data</h2>
      <p class="hint">Statistics are stored locally and never leave your browser.</p>
      <button id="reset-stats" class="btn btn-secondary" type="button">Reset statistics</button>
    </main>
    <script src="options.js"></script>
  </body>
</html>
